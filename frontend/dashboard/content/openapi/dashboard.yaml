  /apps/{id}/networkRequests/endpoints:
    get:
      operationId: getNetworkRequestsEndpoints
      tags:
        - Network Requests
      summary: List an app's network endpoints
      description: |
        An empty query returns up to 20 generated endpoint patterns. A non-empty
        query returns a de-duplicated union of up to 20 matching generated
        endpoint patterns and up to 20 matching captured request paths (up to
        40 results total). Each source is ranked by request count.

        Use `query` to search endpoint text or enter a domain and path pattern.
        `from` and `to` default to the last seven days when omitted.
      parameters:
        - name: id
          in: path
          required: true
          description: App's UUID.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: query
          in: query
          required: false
          description: Endpoint text or a domain and path pattern.
          schema:
            type: string
      responses:
        "200":
          description: Successful response, no errors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    maxItems: 40
                    items:
                      type: object
                      properties:
                        domain:
                          type: string
                        path_pattern:
                          type: string
              examples:
                response:
                  value:
                    results:
                      - domain: api.example.com
                        path_pattern: /api/users/*
                      - domain: cdn.example.com
                        path_pattern: /assets/**
        "400":
          description: Request URI is malformed or does not meet one or more acceptance criteria. Check the `error` field for more details.
