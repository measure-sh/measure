  /apps/{id}/filters/keys:
    get:
      operationId: getFilterKeys
      tags:
        - Apps
      summary: Fetch what an entity can be filtered by
      description: |
        Fetches the keys available in an entity, in display order. Each key
        includes its label and description, the type of value it accepts, the
        operators that type supports, and where its values come from.
        `key_groups` lists the groups the keys fall into, also in display order.

        Unrelated to `/apps/{id}/filters`, which serves the older fixed set of
        app filters.
      parameters:
        - name: id
          in: path
          required: true
          description: App's UUID.
          schema:
            type: string
            format: uuid
        - name: entity
          in: query
          required: true
          description: Name of the entity to describe.
          schema:
            type: string
            enum:
              - builds
              - spans
              - bug_reports
        - name: key
          in: query
          required: false
          description: |
            Name of a key to resolve and include even when the custom key
            listing is truncated. Repeat the parameter for each name, like
            `key=custom.plan&key=custom.tier`. Keys not present in app data
            are ignored.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Successful response, no errors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/FilterKey"
                  key_groups:
                    type: array
                    description: |
                      The groups these keys fall into, in the order to offer
                      them in. Every key's `key_group` is one of these.
                    items:
                      type: string
                  keys_truncated:
                    type: boolean
                    description: |
                      True when the app has more custom keys than the listing
                      returns.
              examples:
                response:
                  value:
                    key_groups:
                      - Version
                      - Build
                    keys_truncated: false
                    keys:
                      - name: version_name
                        label: App version
                        description: The version of the app.
                        key_group: Version
                        value_type: string
                        operators:
                          - in
                          - not_in
                          - contains
                          - starts_with
                        value_suggestion_mode: sample
                      - name: mapping_type
                        label: Mapping type
                        description: "The kind of symbol file uploaded: proguard, dSYM, ELF debug or JS bundle."
                        key_group: Build
                        value_type: enum
                        operators:
                          - in
                          - not_in
                        value_suggestion_mode: full_list
                      - name: patch_id
                        label: Patch id
                        description: The id of an Over-The-Air patch.
                        key_group: Version
                        value_type: uuid
                        operators:
                          - in
                          - not_in
                          - is_set
                          - is_not_set
                        value_suggestion_mode: sample
