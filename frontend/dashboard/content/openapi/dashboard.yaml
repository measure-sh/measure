components:
  parameters:
    From:
      name: from
      in: query
      required: false
      description: "ISO 8601 UTC string in milliseconds precision. Example: `2023-11-01T18:30:00.000Z`. Omitting both `from` and `to` returns the last seven days."
      schema:
        type: string
    To:
      name: to
      in: query
      required: false
      description: "ISO 8601 UTC string in milliseconds precision. Example: `2023-11-01T18:30:00.000Z`. Omitting both `from` and `to` returns the last seven days."
      schema:
        type: string
    Timezone:
      name: timezone
      in: query
      required: true
      description: "IANA timezone used to bucket and format datetime values in the response. Example: `Asia/Kolkata`."
      schema:
        type: string
    PlotTimeGroup:
      name: plot_time_group
      in: query
      required: false
      description: "Time bucket used for plot aggregation. Defaults to `days`."
      schema:
        type: string
        enum:
          - minutes
          - hours
          - days
          - months
    FilterExpr:
        name: filter_expr
        in: query
        required: false
        description: |
          Conditions joined by `AND` or `OR` and grouped with parentheses,
          each reading `key:operator:values` with the names
          `/apps/{id}/filters/keys` publishes. `AND` binds tighter than `OR`.

          ```
          version_name:in:[1.2.0,1.1.9] AND mapping_type:not_in:jsbundle
          (version_name:contains:SNAPSHOT AND mapping_type:in:proguard) OR patch_id:is_set
          ```

          An operator taking no values ends its condition, as
          `patch_id:is_set` does. Double-quote a value holding a space,
          comma, bracket, colon or quote, with `\"` and `\\` inside.

          At most 4096 bytes, 32 conditions, 4 levels of nesting and 200
          values in one condition.
        schema:
          type: string
  schemas:
    FilterKey:
      type: object
      description: One thing an entity can be filtered by.
      properties:
        name:
          type: string
          description: The name `filter_expr` conditions and `key_name` refer to the key by.
        label:
          type: string
          description: What the key is called on screen.
        description:
          type: string
        key_group:
          type: string
          description: |
            The group the key is offered under, and the tab the filter bar
            puts it in. Always one of the `key_groups` the keys response
            lists.
        value_type:
          type: string
          description: |
            The kind of value the key holds, which decides the operators it can
            offer. A numeric type names the width and sign of the column the key
            is compared against, so a value outside that range is refused rather
            than sent to the database.
          enum:
            - string
            - enum
            - uuid
            - int32
            - int64
            - uint32
            - float64
            - bool
            - datetime
        operators:
          type: array
          description: |
            The operators this key offers, in the order to show them. A key may
            offer fewer operators than its type allows but not more.
          items:
            type: string
            enum:
              - in
              - not_in
              - contains
              - not_contains
              - starts_with
              - ends_with
              - eq
              - neq
              - gt
              - gte
              - lt
              - lte
              - is_set
              - is_not_set
              - before
              - after
              - between
        value_suggestion_mode:
          type: string
          description: |
            Where a key's values come from. full_list is a fixed set the key
            declares and accepts no other values; sample contains values reported
            by the app, shown as a recent sample but still open to values not in
            the list; none provides no suggestions and accepts values typed
            directly. A key that takes no values indicates this through its
            operators, which take none.
          enum:
            - full_list
            - sample
            - none
    FilterValue:
      type: object
      description: One value a key can be set to.
      properties:
        text:
          type: string
          description: The value as it is matched against.
        label:
          type: string
          description: |
            What to show instead of `text`, when the two differ. Absent when
            the value reads for itself.
      required:
        - text
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        User access token issued at sign-in. Sent as
        `Authorization: Bearer <access-token>` unless cookies are used to send
        tokens. The `/auth/refresh` and `/auth/signout` endpoints expect the
        session's refresh token in the same header format instead.
