    get:
      operationId: getNetworkRequestsTrends
      tags:
        - Network Requests
      summary: Fetch an app's network request trends
      description: |
        Fetch an app's network request trends showing top endpoints by latency,
        error rate and frequency.

        `from` & `to` will default to a last seven days time range if not
        supplied. Results are limited to the top `trends_limit` most
        relevant endpoints per category (default 10, max 50). P95 latency is in
        milliseconds. Error rate is a percentage (0-100).
      parameters:
        - name: id
          in: path
          required: true
          description: App's UUID.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: trends_limit
          in: query
          required: false
          description: Maximum number of top endpoints to include per category. Defaults to 10, max 50.
          schema:
            type: integer
      responses:
        "200":
          description: Successful response, no errors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  trends_latency:
                    type: array
                    items:
                      type: object
                      properties:
                        domain:
                          type: string
                        path_pattern:
                          type: string
                        p95_latency:
                          type: number
                        error_rate:
                          type: number
                        frequency:
                          type: number
                  trends_error_rate:
                    type: array
                    items:
                      type: object
                      properties:
                        domain:
                          type: string
                        path_pattern:
                          type: string
                        p95_latency:
                          type: number
                        error_rate:
                          type: number
                        frequency:
                          type: number
                  trends_frequency:
                    type: array
                    items:
                      type: object
                      properties:
                        domain:
                          type: string
                        path_pattern:
                          type: string
                        p95_latency:
                          type: number
                        error_rate:
                          type: number
                        frequency:
                          type: number
              examples:
                response:
                  value:
                    trends_latency:
                      - domain: api.example.com
                        path_pattern: /api/users
                        p95_latency: 250.5
                        error_rate: 2.3
                        frequency: 15000
                    trends_error_rate:
                      - domain: api.example.com
                        path_pattern: /api/auth
