  /apps/{id}/filters/values:
    get:
      operationId: getFilterValues
      tags:
        - Apps
      summary: Fetch the values one filter key can be set to
      description: |
        Fetches the values a single key in an entity can be set to, narrowed
        by `search`.

        For keys backed by app data, values are read from the entity's own rows,
        most recently seen first, with rows where the key is unset excluded. For
        keys with a fixed set of values, such as `mapping_type`, values come
        from the set the key declares, which a filter cannot go outside.

        Only keys with a `value_suggestion_mode` of `full_list` or `sample` can
        be listed.
      parameters:
        - name: id
          in: path
          required: true
          description: App's UUID.
          schema:
            type: string
            format: uuid
        - name: entity
          in: query
          required: true
          description: Name of the entity the key belongs to.
          schema:
            type: string
            enum:
              - builds
              - spans
              - bug_reports
        - name: key_name
          in: query
          required: true
          description: Name of the key to list values for, as returned by `/apps/{id}/filters/keys`.
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Substring to narrow values by. Values containing it are returned.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Number of values to return. Defaults to 50, cannot be more than 200.
          schema:
            type: integer
      responses:
        "200":
          description: Successful response, no errors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      $ref: "#/components/schemas/FilterValue"
                  truncated:
                    type: boolean
                    description: True when more values matched than were returned.
              examples:
                response:
                  value:
                    values:
                      - text: 1.2.0
                      - text: "1.1.9"
                      - text: 1.1.8-SNAPSHOT.debug
                    truncated: false
        "400":
          description: Request URI is malformed or does not meet one or more acceptance criteria. Check the `error` field for more details.
