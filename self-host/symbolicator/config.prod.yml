# see a detailed example
# https://github.com/getsentry/symbolicator/blob/dc235b81bce6bf99bd9dfd48952aa342f4f04365/local.example.yml
# or see documentation
# https://getsentry.github.io/symbolicator/

# log
logging:
  level: error
  enable_backtraces: false

bind: "0.0.0.0:3021"

# cache
cache_dir: /data
caches:
  downloaded:
    max_unused_for: 6h
    retry_misses_after: 5m
    retry_misses_after_public: 5m
    retry_malformed_after: 60m
  derived:
    max_unused_for: 12h
    retry_misses_after: 5m
    retry_misses_after_public: 5m
    retry_malformed_after: 60m
enable_cache_cleanup: true

# network
max_concurrent_requests: 1024
connect_to_reserved_ips: true
