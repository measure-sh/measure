# Common Workflow for project-wide linting needs
name: Lint
on: [push, pull_request]

env:
  NODE_VERSION: 24

permissions:
  contents: read
  checks: write

jobs:
  commitlint:
    name: Lint commit message(s)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Print versions
        run: |
          git --version
          node --version
          npm --version
          npx commitlint --version
      - name: Validate last commit
        id: commitlint-push
        if: github.event_name == 'push'
        continue-on-error: true
        run: npx commitlint --from HEAD~1 --to HEAD --verbose

      - name: Validate PR commits
        id: commitlint-pr
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: npx commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Report violations
        if: steps.commitlint-push.outcome == 'failure' || steps.commitlint-pr.outcome == 'failure'
        run: echo "::warning title=Commit message lint::One or more commit messages violate the conventional commit rules. See the validate step log for details."

      - name: Report neutral check
        if: steps.commitlint-push.outcome == 'failure' || steps.commitlint-pr.outcome == 'failure'
        continue-on-error: true
        uses: LouisBrunner/checks-action@v3.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Commit message convention
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          conclusion: neutral
          output: |
            {"title":"Commit message violations","summary":"One or more commit messages do not follow the conventional commit rules. See the Lint job log for details."}
