appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible: "Native Android"
    timeout: 10000
- tapOn: "Native Android"

- scrollUntilVisible:
    element:
      text: "Set User ID"
- tapOn: "Set User ID"

- scrollUntilVisible:
    direction: UP
    element:
      text: "Hold 100 MB Native"
# The SDK samples memory every 5s in the foreground. Hold each allocation
# across a few of those samples so the usage it reports rises.
- tapOn: "Hold 100 MB Native"
- extendedWaitUntil:
    visible:
      text: "__memory_sample_settle__"
    timeout: 12000
    optional: true

- tapOn: "Hold 50 MB Java"
- extendedWaitUntil:
    visible:
      text: "__memory_sample_settle__"
    timeout: 12000
    optional: true

- tapOn: "Release Held Java Memory"
- tapOn: "Release Native Memory"

# In the background the SDK samples every 10s, and only while a service keeps
# the process active. A started service reports the background app state and
# a foreground service reports user_service. Stay backgrounded across a few
# samples for each.
- scrollUntilVisible:
    element:
      text: "Background Service Memory"
- tapOn: "Background Service Memory"
- pressKey: "Home"
- extendedWaitUntil:
    visible:
      text: "__background_sample_settle__"
    timeout: 25000
    optional: true
- launchApp:
    stopApp: false
- tapOn: "Background Service Memory"

- tapOn: "Foreground Service Memory"
- pressKey: "Home"
- extendedWaitUntil:
    visible:
      text: "__background_sample_settle__"
    timeout: 25000
    optional: true
- launchApp:
    stopApp: false
- tapOn: "Foreground Service Memory"
